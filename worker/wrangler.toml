name = "interior-portfolio-photos"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "interior-portfolio"

[[d1_databases]]
binding = "DB"
database_name = "interior-portfolio"
database_id = "c638310b-2f5a-47c4-8a87-c5613b1e8451"

[vars]
# 관리 페이지를 여는 주소들 (여기서만 올리기 가능)
ALLOWED_ORIGINS = "https://v282vhr5sm-stack.github.io, http://localhost:5181"
LIMIT_BYTES = "10737418240"
# 비밀값(ADMIN_PASSWORD, TOKEN_KEY)은 여기 말고 `npx wrangler secret put` 으로 넣습니다
