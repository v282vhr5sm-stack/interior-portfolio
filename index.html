<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://interior-portfolio-photos.saju-site.workers.dev" crossorigin>
<link rel="stylesheet" href="styles.css?v=202610080801">
<script>window.PF_ADMIN = false;</script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/"><span id="brandName"></span><small id="brandTag"></small></a>
  </div>
</header>

<main id="app"><p class="none">불러오는 중…</p></main>

<footer class="foot"><span id="contact"></span></footer>

<div class="lb" id="lb" hidden>
  <button class="lb-x" id="lbClose" aria-label="닫기">✕</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="이전">‹</button>
  <figure class="lb-fig">
    <div class="lb-img"><img id="lbImg" alt="" draggable="false"><video id="lbVid" controls playsinline preload="metadata" controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture disableremoteplayback hidden></video></div>
    <figcaption>
      <span id="lbCap"></span>
      <a id="lbSite" href="#">이 현장 전체 보기 →</a>
      <span class="lb-zoom" id="lbZoom" hidden><button type="button" id="zOut" aria-label="축소">−</button><span id="zPct">100%</span><button type="button" id="zIn" aria-label="확대">+</button></span>
      <span class="lb-n" id="lbN"></span>
    </figcaption>
    <div id="lbEdit"></div>
  </figure>
  <button class="lb-nav next" id="lbNext" aria-label="다음">›</button>
</div>
<div class="shield-msg">화면을 누르면 다시 보여요</div>

<script src="config.js?v=202610080801"></script>
<script src="app.js?v=202610080801"></script>
</body>
</html>
